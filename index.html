<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sarcopenic Dysphagia Prevalence Study Data</title>

<style>
body{font-family:Arial;background:#f6f8fb;margin:0;}
.container{max-width:1000px;margin:auto;padding:16px;}
.section{background:white;padding:12px 14px;margin-bottom:12px;border-radius:8px;border:1px solid #e6e9ef;}
h1{text-align:center;}
h2{font-size:14px;color:#1e3799;margin-bottom:10px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
.field{display:flex;flex-direction:column;}
label{font-size:12px;margin-bottom:2px;}
input, select{padding:6px 8px;font-size:13px;border:1px solid #ccc;border-radius:5px;}
button{width:100%;padding:10px;background:#2f59c0;color:white;border:none;border-radius:6px;}

@media(max-width:600px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="container">

<h1>📊 Sarcopenic Dysphagia Prevalence Study Data</h1>

<form id="form" onsubmit="submitData(event)">

<div class="section">
<h2>1️⃣ Personal Information</h2>

<div class="grid">

<div class="field">
<label>ST</label>
<select name="st">
<option>Select</option>
<option>Dorothy</option>
<option>Mattew</option>
<option>Tina</option>
<option>Bibianna</option>
</select>
</div>

<div class="field"><label>RCHE no.</label><input name="rche"></div>

<div class="field">
<label>Type of RCHE</label>
<select name="rcheType">
<option value="">Select</option>
<option>CONTRACT</option>
<option>PRIVATE</option>
</select>
</div>

<div class="field"><label>Case no.</label><input name="caseNo"></div>

<div class="field"><label>Age</label><input type="number" name="age"></div>

<div class="field">
<label>Gender</label>
<select name="gender"><option>Male</option><option>Female</option></select>
</div>

<div class="field"><label>Date of Ax</label><input type="date" name="date"></div>

<div class="field"><label>Weight</label>
<input id="weight" name="weight" type="number" oninput="calcBMI()"></div>

<div class="field"><label>Height</label>
<input id="height" name="height" type="number" oninput="calcBMI()"></div>

<div class="field"><label>BMI</label>
<input id="bmi" name="bmi" readonly></div>

</div>
</div>

<button type="submit">Submit</button>

</form>

</div>

<script>

/* ✅ BMI */
function calcBMI(){
 let h = document.getElementById("height").value / 100;
 let w = document.getElementById("weight").value;
 if(h && w){
  document.getElementById("bmi").value = (w/(h*h)).toFixed(2);
 }
}

/* ✅ 提交去 Google Sheet */
function submitData(e){
 e.preventDefault();

 const url = "https://script.google.com/macros/s/AKfycbxIG66a-lCg_G6onZtrvA8NYtNdGsM9Ml-zW6kjEO5A2ZUY5dsnI-s2RWRkOueXavaM/exec";

 let data = {
  st: val("st"),
  rche: val("rche"),
  rcheType: val("rcheType"),
  caseNo: val("caseNo"),
  age: val("age"),
  gender: val("gender"),
  date: val("date"),
  weight: val("weight"),
  height: val("height"),
  bmi: val("bmi")
 };

 fetch(url,{
  method:"POST",
  body: JSON.stringify(data),
  headers:{ "Content-Type":"application/json" }
 })
 .then(res=>res.json())
 .then(()=>{
  alert("✅ Data saved to Google Sheet");
  document.getElementById("form").reset();
 })
 .catch(()=>{
  alert("❌ Error submitting");
 });
}

/* helpers */
function val(name){
 return document.querySelector(`[name='${name}']`)?.value || "";
}

</script>

</body>
</html>
``
