<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarcopenic Dysphagia Prevalence Study Data</title>
<style>
  body { font-family: Arial, sans-serif; background: #eef2f7; margin: 0; padding: 20px; }
  .container { max-width: 950px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
  h1 { text-align: center; color: #1e3799; margin-bottom: 30px; }
  h2 { color: #192a56; border-left: 5px solid #4a69bd; padding-left: 8px; margin-top: 30px; margin-bottom: 15px; }
  
  /* 搜尋區塊樣式 */
  .search-box { background: #ffeaa7; padding: 15px; border-radius: 10px; margin-bottom: 25px; display: flex; gap: 10px; align-items: center; }
  .search-box input { flex: 2; }
  .search-box button { flex: 1; margin: 0; padding: 10px; background: #d35400; font-size: 14px; }
  .search-box button:hover { background: #b33921; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
  label { font-size: 14px; font-weight: 500; display: block; margin-bottom: 5px; }
  .qno { font-weight: bold; color: #1e3799; margin-right: 5px; }
  input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 14px; background-color: white; }
  input:focus, select:focus { outline: none; border-color: #4a69bd; box-shadow: 0 0 5px rgba(74, 105, 189, 0.3); }
  input.invalid, select.invalid { border: 2px solid red; background: #fff5f5; }
  
  .btn-container { display: flex; gap: 15px; margin-top: 30px; }
  button { flex: 1; padding: 15px; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
  .btn-submit { background: #1e3799; }
  .btn-submit:hover { background: #142870; }
  .btn-submit:disabled { background: #a5b1c2; cursor: not-allowed; }
  .btn-print { background: #20bf6b; }
  .btn-print:hover { background: #1b9454; }

  @media(max-width:768px){ 
    .grid, .grid-3 { grid-template-columns: 1fr; } 
    .btn-container { flex-direction: column; }
    .search-box { flex-direction: column; align-items: stretch; }
  }

  /* 🖨️ PDF 列印美化設定 */
  @media print {
    body { background: white; padding: 0; margin: 0; }
    .container { box-shadow: none; padding: 0; max-width: 100%; }
    .btn-container, .search-box { display: none !important; } /* 列印時隱藏搜尋欄與按鈕 */
    input, select { 
      border: none !important; 
      border-bottom: 1px solid #000 !important; 
      border-radius: 0 !important; 
      background: transparent !important;
      padding: 5px 0 !important;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }
    .section { page-break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>📊 Sarcopenic Dysphagia Prevalence Study Data</h1>
  
  <div class="search-box">
    <span style="font-weight: bold; color: #d35400;">🔍 尋找舊個案列印：</span>
    <input type="text" id="searchCaseNo" placeholder="請輸入 Case no.">
    <button type="button" id="searchBtn">載入歷史資料</button>
  </div>

  <form id="form">
    <div class="section">
      <h2>1️⃣ 基本資料 (Basic Information)</h2>
      <div class="grid">
        <div><label><span class="qno">1.1</span>ST</label>
          <select name="st" required>
            <option value="" disabled selected>選擇 ST</option>
            <option>Dorothy</option>
            <option>Mattew</option>
            <option>Tina</option>
            <option>Bibianna</option>
          </select>
        </div>
        <div><label><span class="qno">1.2</span>RCHE no.</label><input name="rche_no" required></div>
        <div><label><span class="qno">1.3</span>Type of RCHE</label>
          <select name="type_of_rche">
            <option value="">Select</option>
            <option>Private</option>
            <option>Contract</option>
          </select>
        </div>
        <div><label><span class="qno">1.4</span>Case no.</label><input name="case_no" required></div>
        <div><label><span class="qno">1.5</span>Age</label><input name="age" type="number" required></div>
        <div><label><span class="qno">1.6</span>Gender</label>
          <select name="gender" required>
            <option value="" disabled selected>Select</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>
        <div><label><span class="qno">1.7</span>Date of Ax</label><input name="date_of_ax" type="date" required></div>
        <div><label><span class="qno">1.8</span>Weight (kg)</label><input id="weight" name="weight" type="number" step="0.1" oninput="calcBMI()" required></div>
        <div><label><span class="qno">1.9</span>Height (cm)</label><input id="height" name="height" type="number" step="0.1" oninput="calcBMI()" required></div>
        <div><label><span class="qno">1.10</span>BMI</label><input id="bmi" name="bmi" readonly placeholder="自動計算"></div>
      </div>
      <div style="margin-top: 15px;">
        <label><span class="qno">1.11</span>MNA-SF</label><input name="mna_sf" placeholder="Enter MNA-SF score">
      </div>
    </div>

    <div class="section">
      <h2>2️⃣ Medical History (PMHx)</h2>
      <div class="grid">
        <div><label><span class="qno">2.1</span>CVA</label><select name="cva"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
        <div><label><span class="qno">2.2</span>Parkinson's</label><select name="parkinson"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
        <div><label><span class="qno">2.3</span>TBI/SCI</label><select name="tbi_sci"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
        <div><label><span class="qno">2.4</span>Brain tumor</label><select name="brain_tumor"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
        <div><label><span class="qno">2.5</span>Neuromuscular diseases</label><select name="neuromuscular"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
        <div><label><span class="qno">2.6</span>Head and Neck Cancer</label><select name="head_neck_cancer"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
        <div><label><span class="qno">2.7</span>Connective tissue diseases</label><select name="connective_disease"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
        <div><label><span class="qno">2.8</span>COPD</label><select name="copd"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
        <div><label><span class="qno">2.9</span>Dementia</label><select name="dementia"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
        <div><label><span class="qno">2.10</span>Other causes for DSG</label>
          <select name="other_causes_dsg">
            <option value="">Select</option><option>Obvious</option><option>Potential</option><option>No</option>
          </select>
        </div>
      </div>
      <br>
      <div class="grid">
        <div><label><span class="qno">2.11</span>Other causes (Specify here)</label><input name="other_causes_specify"></div>
        <div><label><span class="qno">2.12</span>Other PMHx</label><input name="other_pmhx"></div>
      </div>
    </div>

    <div class="section">
      <h2>3️⃣ Admissions & Services</h2>
      <div class="grid">
        <label><span class="qno">3.1</span>Pneumonia episodes</label><input name="pneu_episodes" type="number" min="0">
        <label><span class="qno">3.2</span>Pneumonia Total LOS (days)</label><input name="pneu_los" type="number" min="0">
        <label><span class="qno">3.3</span>Fall episodes</label><input name="fall_episodes" type="number" min="0">
        <label><span class="qno">3.4</span>Fall Total LOS (days)</label><input name="fall_los" type="number" min="0">
        <label><span class="qno">3.5</span>UTI/Dehydration episodes</label><input name="uti_episodes" type="number" min="0">
        <label><span class="qno">3.6</span>UTI/Dehydration Total LOS</label><input name="uti_los" type="number" min="0">
        <label><span class="qno">3.7</span>No. of MOSTE ST sessions</label><input name="moste_st_sessions" type="number" min="0">
        <label><span class="qno">3.8</span>No. of MOSTE PT sessions</label><input name="moste_pt_sessions" type="number" min="0">
        <label><span class="qno">3.9</span>Dietetic service</label><select name="dietetic_service"><option value="">Select</option><option>Yes</option><option>No</option></select>
        <label><span class="qno">3.10</span>On oral nutritional supplements (ONS)</label><select name="ons"><option value="">Select</option><option>Yes</option><option>No</option></select>
        <label><span class="qno">3.11</span>Pitting Edema</label><select name="pitting_edema"><option value="">Select</option><option>Yes</option><option>No</option><option>Invalid</option></select>
      </div>
    </div>

    <div class="section">
      <h2>4️⃣ Sarcopenia & Clinical Measurements</h2>
      <div class="grid">
        <label><span class="qno">4.1</span>CC (cm) [Invalid or Number]</label><input name="cc" placeholder="例如: 31 或 Invalid">
        <label><span class="qno">4.2</span>MUAC (cm)</label><input name="muac" type="number" step="0.1">
        <label><span class="qno">4.3</span>HGS (kg)</label><input name="hgs" type="number" step="0.1">
        <label><span class="qno">4.4</span>Reliability of HGS</label>
        <select name="hgs_reliability"><option value="">Select</option><option>Reliable</option><option>Questionable</option><option>Cannot be measured</option></select>
        <label><span class="qno">4.5</span>Max Tongue Pressure (kPa)</label><input name="tongue_pressure" type="number" step="0.1">
        <label><span class="qno">4.6</span>Reliability of Tongue Data</label>
        <select name="tongue_reliability"><option value="">Select</option><option>Reliable</option><option>Questionable</option><option>Cannot be measured</option></select>
        <label><span class="qno">4.7</span>Max Chin Tuck Strength (kPa)</label><input name="chin_tuck" type="number" step="0.1">
        <label><span class="qno">4.8</span>Reliability of Chin Tuck Data</label>
        <select name="chin_reliability"><option value="">Select</option><option>Reliable</option><option>Questionable</option><option>Cannot be measured</option></select>
      </div>
    </div>

    <div class="section">
      <h2>5️⃣ Dysphagia & Outcome Measures (DSG)</h2>
      <div class="grid">
        <label><span class="qno">5.1</span>DSG</label><select name="dsg"><option value="">Select</option><option>Yes</option><option>No</option></select>
        <label><span class="qno">5.2</span>Type of DSG</label>
        <select name="type_of_dsg">
          <option value="">Select</option><option>Sarcopenic Dysphagia</option><option>Presbyphagia</option><option>Neurogenic Dysphagia</option><option>Mechanical Dysphagia</option><option>Psychogenic Dysphagia</option><option>Other causes</option><option>Normal</option>
        </select>
        <label><span class="qno">5.3</span>IDDSI Liquid Level</label>
        <select name="iddsi_liquid"><option value="">Select</option><option>0 - Thin</option><option>1 - Slightly Thick</option><option>2 - Mildly Thick</option><option>3 - Moderately Thick</option><option>4 - Extremely Thick</option></select>
        <label><span class="qno">5.4</span>IDDSI Food Level</label>
        <select name="iddsi_food"><option value="">Select</option><option>3 - Liquidised</option><option>4 - Pureed</option><option>5 - Minced & Moist</option><option>6 - Soft & Bite-sized</option><option>7 - Regular / Easy to Chew</option></select>
        <label><span class="qno">5.5</span>IDDSI-FDS</label>
        <select name="iddsi_fds"><option value="">Select</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select>
        <label><span class="qno">5.6</span>TOM_Impairment</label>
        <select name="tom_impairment"><option value="">Select</option><option>0</option><option>0.5</option><option>1</option><option>1.5</option><option>2</option><option>2.5</option><option>3</option><option>3.5</option><option>4</option><option>4.5</option><option>5</option></select>
        <label><span class="qno">5.7</span>TOM_Activity</label>
        <select name="tom_activity"><option value="">Select</option><option>0</option><option>0.5</option><option>1</option><option>1.5</option><option>2</option><option>2.5</option><option>3</option><option>3.5</option><option>4</option><option>4.5</option><option>5</option></select>
      </div>
    </div>

    <div class="btn-container">
      <button type="submit" class="btn-submit" id="submitBtn">💾 Submit Data</button>
      <button type="button" class="btn-print" id="printBtn">🖨️ Export PDF / Print</button>
    </div>
  </form>
</div>

<script>
const scriptURL = 'https://script.google.com/macros/s/AKfycbwGls7YCho5UpH5IckkDnufeY_AAouXMPXTr2sDoUvQk1Q20m1BzsZ2GN35um0vF1GUeg/exec'; 

/* 🔍 新增功能：從 Google 試算表搜尋並回填資料 */
document.getElementById("searchBtn").addEventListener("click", function() {
  let caseNo = document.getElementById("searchCaseNo").value.trim();
  if(!caseNo) { alert("請輸入 Case no.！"); return; }
  
  let btn = this;
  btn.disabled = true;
  btn.innerText = "🔍 搜尋中...";
  
  // 透過 URL 參數發送 GET 請求
  fetch(`${scriptURL}?search_case=${encodeURIComponent(caseNo)}`)
  .then(res => res.json())
  .then(res => {
    if(res.status === "success") {
      alert("🎉 成功找到個案資料，已自動填入表單！");
      let data = res.data;
      
      // 自動將抓回來的資料填入網頁表單中對應的元件
      Object.keys(data).forEach(key => {
        let field = document.querySelector(`[name='${key}']`);
        if(field) {
          // 如果是日期格式，需要稍微轉換成 YYYY-MM-DD
          if(field.type === "date" && data[key]) {
            let dateObj = new Date(data[key]);
            if(!isNaN(dateObj)) {
              field.value = dateObj.toISOString().split('T')[0];
              return;
            }
          }
          field.value = data[key];
        }
      });
      calcBMI(); // 重新計算 BMI
    } else {
      alert("❌ 找不到該 Case no. 的歷史資料。");
    }
    btn.disabled = false;
    btn.innerText = "載入歷史資料";
  })
  .catch(err => {
    console.error(err);
    alert("搜尋出錯，請確認 Apps Script 已正確部署。");
    btn.disabled = false;
    btn.innerText = "載入歷史資料";
  });
});

/* 🖨️ 輸出 PDF 檔案列印 */
document.getElementById("printBtn").addEventListener("click", function() { window.print(); });

/* 自動計算 BMI */
function calcBMI(){
  let h = document.getElementById("height").value / 100;
  let w = document.getElementById("weight").value;
  if(h && w){ document.getElementById("bmi").value = (w / (h * h)).toFixed(2); } 
  else { document.getElementById("bmi").value = ""; }
}

/* 表單提交事件處理 */
document.getElementById("form").addEventListener("submit", function(e) {
  e.preventDefault(); 
  let ok = true;
  document.querySelectorAll("input[required], select[required]").forEach(f => {
    if (!f.value) { f.classList.add("invalid"); ok = false; } 
    else { f.classList.remove("invalid"); }
  });
  if (!ok) {
    let first = document.querySelector(".invalid");
    first.scrollIntoView({ behavior: "smooth", block: "center" });
    first.focus();
    return;
  }
  const submitButton = document.getElementById("submitBtn");
  submitButton.disabled = true;
  submitButton.innerText = "⏳ Sending Data...";

  const formData = new FormData(this);
  const urlParams = new URLSearchParams(formData).toString();

  fetch(scriptURL, {
    method: "POST",
    mode: "no-cors", 
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: urlParams
  })
  .then(response => {
    alert("🎉 資料已成功排程並寫入 Google 試算表！");
    document.getElementById("form").reset(); 
    document.getElementById("bmi").value = ""; 
    submitButton.disabled = false;
    submitButton.innerText = "💾 Submit Data";
  })
  .catch(error => {
    alert("❌ 儲存失敗。");
    submitButton.disabled = false;
    submitButton.innerText = "💾 Submit Data";
  });
});

/* Enter 跳下一格 */
let fields = document.querySelectorAll("input, select");
fields.forEach((el, i) => {
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      if (el.type !== "submit" && el.type !== "button") {
        e.preventDefault();
        for (let j = i + 1; j < fields.length; j++) {
          if (!fields[j].disabled && fields[j].type !== "hidden") {
            fields[j].focus();
            break;
          }
        }
      }
    }
  });
});
</script>
</body>
</html>
