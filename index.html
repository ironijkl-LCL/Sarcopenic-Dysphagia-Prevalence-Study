<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sarcopenic Dysphagia Prevalence Study Data</title>

<style>
body{
  font-family: Arial;
  background:#f6f8fb;
  margin:0;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:18px;
}

.section{
  background:#fff;
  padding:12px 14px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #e6e9ef;
}

h1{
  text-align:center;
  margin-bottom:18px;
}

h2{
  font-size:14px;
  color:#1e3799;
  margin-bottom:10px;
}

/* ✅ 核心：對齊 */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 14px;
}

.field{
  display:flex;
  flex-direction:column;
}

label{
  font-size:12px;
  margin-bottom:2px;
}

.qno{
  font-weight:bold;
  color:#1e3799;
  margin-right:4px;
}

input, select{
  padding:6px 8px;
  font-size:13px;
  border:1px solid #ccc;
  border-radius:5px;
  box-sizing:border-box;
}

/* checkbox */
.checkbox-group{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px 10px;
}

/* button */
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#2f59c0;
  color:white;
  border:none;
  border-radius:6px;
}

/* mobile */
@media(max-width:600px){
  .grid{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<div class="container">

<h1>📊 Sarcopenic Dysphagia Prevalence Study Data</h1>

<form>

<!-- ✅ 1 PERSONAL -->
<div class="section">
<h2>1️⃣ Personal Information</h2>

<div class="grid">

<div class="field"><label><span class="qno">1.1</span>ST</label>
<select><option>Select</option>
<option>Dorothy</option><option>Mattew</option><option>Tina</option><option>Bibianna</option>
</select></div>

<div class="field"><label><span class="qno">1.2</span>RCHE no.</label><input></div>

<div class="field"><label><span class="qno">1.3</span>Type of RCHE</label><input></div>

<div class="field"><label><span class="qno">1.4</span>Case no.</label><input></div>

<div class="field"><label><span class="qno">1.5</span>Age</label><input type="number"></div>

<div class="field"><label><span class="qno">1.6</span>Gender</label>
<select><option>Male</option><option>Female</option></select></div>

<div class="field"><label><span class="qno">1.7</span>Date of Ax</label><input type="date"></div>

<div class="field"><label><span class="qno">1.8</span>Weight (kg)</label><input></div>

<div class="field"><label><span class="qno">1.9</span>Height (cm)</label><input></div>

<div class="field"><label><span class="qno">1.10</span>BMI</label><input></div>

</div>
</div>

<!-- ✅ 2 MALNUTRITION -->
<div class="section">
<h2>2️⃣ Malnutrition</h2>

<div class="grid">

<div class="field"><label><span class="qno">2.1</span>MNA-SF</label><input></div>

<div class="field"><label><span class="qno">2.2</span>Oral nutritional supplement</label>
<select><option>Yes</option><option>No</option></select></div>

<div class="field"><label><span class="qno">2.3</span>Pitting Edema</label>
<select><option>Yes</option><option>No</option></select></div>

</div>
</div>

<!-- ✅ 3 PMHx -->
<div class="section">
<h2>3️⃣ Medical History</h2>

<div class="checkbox-group">
<label><input type="checkbox">CVA</label>
<label><input type="checkbox">Parkinson's</label>
<label><input type="checkbox">TBI/SCI</label>
<label><input type="checkbox">Brain tumor</label>
<label><input type="checkbox">Neuromuscular diseases</label>
<label><input type="checkbox">Head and Neck Cancer</label>
<label><input type="checkbox">Connective tissue diseases</label>
<label><input type="checkbox">COPD</label>
<label><input type="checkbox">Dementia</label>
</div>

<br>

<div class="grid">
<div class="field"><label>Other causes for DSG</label><input></div>
<div class="field"><label>Other PMHx</label><input></div>
</div>

</div>

<!-- ✅ 4 ADMISSION -->
<div class="section">
<h2>4️⃣ Admission (6 months)</h2>

<div class="grid">

<div class="field"><label>Pneumonia episodes</label><input></div>
<div class="field"><label>Pneumonia LOS</label><input></div>
<div class="field"><label>Fall episodes</label><input></div>
<div class="field"><label>Fall LOS</label><input></div>
<div class="field"><label>UTI episodes</label><input></div>
<div class="field"><label>UTI LOS</label><input></div>

</div>
</div>

<!-- ✅ 5 SARCOPENIA -->
<div class="section">
<h2>5️⃣ Sarcopenia Assessment</h2>

<div class="grid">

<div class="field"><label>CC</label><input></div>
<div class="field"><label>MUAC</label><input></div>
<div class="field"><label>HGS</label><input></div>
<div class="field"><label>HGS Reliability</label><select><option>Reliable</option><option>Unreliable</option></select></div>
<div class="field"><label>Tongue Pressure</label><input></div>
<div class="field"><label>Tongue Reliability</label><select><option>Reliable</option><option>Unreliable</option></select></div>
<div class="field"><label>Chin Tuck Strength</label><input></div>
<div class="field"><label>Chin Reliability</label><select><option>Reliable</option><option>Unreliable</option></select></div>

</div>
</div>

<button>Submit</button>

</form>

</div>

</body>
</html>
