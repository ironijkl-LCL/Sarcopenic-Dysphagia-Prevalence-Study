<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sarcopenic Dysphagia Prevalence Study Data</title>

<style>
body{
  font-family:-apple-system, Arial;
  background:#f6f8fb;
  margin:0;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:16px;
}

.section{
  background:white;
  padding:12px 14px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #e6e9ef;
}

h1{text-align:center;margin-bottom:18px;}

h2{
  font-size:14px;
  color:#1e3799;
  margin-bottom:10px;
}

/* ✅ 排版核心 */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 14px;
}

.field{
  display:flex;
  flex-direction:column;
}

label{
  font-size:12px;
  margin-bottom:2px;
}

.qno{
  font-weight:bold;
  color:#1e3799;
  margin-right:4px;
}

input, select{
  padding:6px 8px;
  font-size:13px;
  border:1px solid #ccc;
  border-radius:5px;
}

/* checkbox */
.checkbox-group{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px 10px;
}

/* button */
button{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#2f59c0;
  color:white;
  border:none;
  border-radius:6px;
}

@media(max-width:600px){
  .grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<div class="container">

<h1>📊 Sarcopenic Dysphagia Prevalence Study Data</h1>

<form>

<!-- 1 PERSONAL -->
<div class="section">
<h2>1️⃣ Personal Information</h2>
<div class="grid">

<div class="field">
<label><span class="qno">1.1</span>ST</label>
<select>
<option>Select</option>
<option>Dorothy</option>
<option>Mattew</option>
<option>Tina</option>
<option>Bibianna</option>
</select>
</div>

<div class="field"><label><span class="qno">1.2</span>RCHE no.</label><input></div>

<div class="field">
<label><span class="qno">1.3</span>Type of RCHE</label>
<select>
<option value="">Select</option>
<option>CONTRACT</option>
<option>PRIVATE</option>
</select>
</div>

<div class="field"><label><span class="qno">1.4</span>Case no.</label><input></div>

<div class="field"><label><span class="qno">1.5</span>Age</label><input type="number"></div>

<div class="field"><label><span class="qno">1.6</span>Gender</label>
<select><option>Male</option><option>Female</option></select></div>

<div class="field"><label><span class="qno">1.7</span>Date of Ax</label><input type="date"></div>

<div class="field"><label><span class="qno">1.8</span>Weight (kg)</label>
<input id="weight" type="number" oninput="calcBMI()"></div>

<div class="field"><label><span class="qno">1.9</span>Height (cm)</label>
<input id="height" type="number" oninput="calcBMI()"></div>

<div class="field"><label><span class="qno">1.10</span>BMI</label>
<input id="bmi" readonly></div>

</div>
</div>

<!-- 2 MALNUTRITION -->
<div class="section">
<h2>2️⃣ Malnutrition</h2>
<div class="grid">

<div class="field"><label><span class="qno">2.1</span>MNA-SF</label><input></div>

<div class="field"><label><span class="qno">2.2</span>Oral Nutritional Supplements</label>
<select><option>Yes</option><option>No</option></select></div>

<div class="field"><label><span class="qno">2.3</span>Pitting Edema</label>
<select><option>Yes</option><option>No</option></select></div>

</div>
</div>

<!-- 3 MEDICAL HISTORY -->
<div class="section">
<h2>3️⃣ Medical History</h2>

<div class="checkbox-group">
<label><input type="checkbox">CVA</label>
<label><input type="checkbox">Parkinson's</label>
<label><input type="checkbox">TBI/SCI</label>
<label><input type="checkbox">Brain tumor</label>
<label><input type="checkbox">Neuromuscular diseases</label>
<label><input type="checkbox">Head and Neck Cancer</label>
<label><input type="checkbox">Connective tissue diseases</label>
<label><input type="checkbox">COPD</label>
<label><input type="checkbox">Dementia</label>
</div>

<br>

<div class="grid">
<div class="field"><label>Other causes for DSG</label><input></div>
<div class="field"><label>Other PMHx</label><input></div>
</div>

</div>

<!-- 4 ADMISSION -->
<div class="section">
<h2>4️⃣ Admissions (6 months)</h2>

<div class="grid">

<div class="field"><label>Pneumonia Episodes</label><input></div>
<div class="field"><label>Pneumonia LOS (days)</label><input></div>

<div class="field"><label>Fall Episodes</label><input></div>
<div class="field"><label>Fall LOS (days)</label><input></div>

<div class="field"><label>UTI/Dehydration Episodes</label><input></div>
<div class="field"><label>LOS (days)</label><input></div>

</div>
</div>

<!-- 5 SARCOPENIA -->
<div class="section">
<h2>5️⃣ Sarcopenia Measurement</h2>

<div class="grid">

<div class="field"><label>CC (cm)</label><input></div>
<div class="field"><label>MUAC (cm)</label><input></div>

<div class="field"><label>HGS (kg)</label><input></div>
<div class="field"><label>Reliability of HGS</label>
<select><option>Reliable</option><option>Unreliable</option></select></div>

<div class="field"><label>Maximum Tongue Pressure</label><input></div>
<div class="field"><label>Reliability (Tongue)</label>
<select><option>Reliable</option><option>Unreliable</option></select></div>

<div class="field"><label>Chin Tuck Strength</label><input></div>
<div class="field"><label>Reliability (Chin)</label>
<select><option>Reliable</option><option>Unreliable</option></select></div>

</div>
</div>

<button>Submit</button>

</form>

</div>

<script>
function calcBMI(){
 let h = document.getElementById("height").value / 100;
 let w = document.getElementById("weight").value;
 if(h && w){
  document.getElementById("bmi").value = (w/(h*h)).toFixed(2);
 }
}
</script>

</body>
</html>
